# wrt-hotspot: room for many clients in the neighbor tables.
# The kernel defaults (128/512/1024) drop entries beyond ~1000, and every
# IPv6 client holds several (link-local, global, privacy addresses), so a
# few hundred dual-stack devices already hit the limit. Entries only use
# memory while they exist.
net.ipv4.neigh.default.gc_thresh1 = 1024
net.ipv4.neigh.default.gc_thresh2 = 4096
net.ipv4.neigh.default.gc_thresh3 = 8192
net.ipv6.neigh.default.gc_thresh1 = 1024
net.ipv6.neigh.default.gc_thresh2 = 8192
net.ipv6.neigh.default.gc_thresh3 = 16384
