<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="2; url=$(link-redirect)">
<title>$(identity) - Connected</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="main">
	<div class="wrap">
		<img class="logo" src="img/logo.svg" alt="OpenWrt">
		<p class="info">You are logged in, $(username)<br>Redirecting&hellip;</p>
		<a class="button" href="$(link-redirect)">Continue</a>
		<a class="button ghost" href="$(link-status)">Status</a>
		<p class="info bt">Powered by <a href="https://openwrt.org/">OpenWrt</a> &middot; <a href="https://github.com/usamakkhan/wrt-hotspot">WrtHotspot</a></p>
	</div>
</main>
</body>
</html>
