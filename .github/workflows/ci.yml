name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    # The OpenWrt rootfs image ships the same ucode and nft as a router.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: [ "24.10.8", "25.12.6" ]
    steps:
      - uses: actions/checkout@v7
      - name: unit tests on OpenWrt ${{ matrix.release }}
        run: |
          docker run --rm --cap-add NET_ADMIN -v "$PWD:/src" "openwrt/rootfs:x86-64-${{ matrix.release }}" /bin/sh -c '
            set -e
            mkdir -p /var/lock /tmp
            PKGS="ucode ucode-mod-fs ucode-mod-uci ucode-mod-uloop ucode-mod-digest ucode-mod-socket ucode-mod-struct nftables-json"
            if command -v apk >/dev/null; then apk update && apk add $PKGS; else opkg update && opkg install $PKGS; fi
            sh /src/tests/run-unit.sh'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -s sh -S error scripts/*.sh tests/run-unit.sh tests/integration/*.sh tests/emu/*.sh \
            feed/net/wrt-hotspot/files/etc/init.d/wrthotspot
      - name: scripts are executable
        # Commits from Windows (core.fileMode=false) lose the x bit.
        run: |
          bad=$(git ls-files -s -- '*.sh' '*.py' 'feed/net/wrt-hotspot/files/usr/sbin/*' \
            'feed/net/wrt-hotspot/files/etc/init.d/*' | awk '$1 != "100755" { print $4 }')
          [ -z "$bad" ] || { echo "not executable in git (git update-index --chmod=+x):"; echo "$bad"; exit 1; }
      - name: JSON files
        run: find feed -name '*.json' -print0 | xargs -0 -n1 python3 -m json.tool > /dev/null
      - name: JavaScript syntax
        run: |
          for f in $(find feed -name '*.js'); do
            # LuCI views are function bodies ('use strict'; ... return view.extend(...)).
            node -e 'new Function(require("fs").readFileSync(process.argv[1], "utf8"))' "$f" || exit 1
          done

  packages:
    needs: unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: [ "24.10.8", "25.12.6" ]
    steps:
      - uses: actions/checkout@v7
      - name: SDK prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential gawk gettext git libncurses-dev \
            python3 python3-setuptools rsync unzip zstd wget file
      - name: cache SDK
        uses: actions/cache@v6
        with:
          path: build
          key: sdk-${{ matrix.release }}-v1
      - name: build
        # Throwaway signing keys: CI artifacts are for testing, the release
        # feeds are signed on the machine that holds the project keys.
        env:
          WRTHOTSPOT_NEW_KEYS: "1"
        run: scripts/build-packages.sh ${{ matrix.release }}
      - uses: actions/upload-artifact@v7
        with:
          name: wrt-hotspot-${{ matrix.release }}
          path: dist/${{ matrix.release }}/
